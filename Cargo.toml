[workspace]
resolver = "3"
members = ["crates/app", "crates/core", "crates/storage", "crates/trackers/*"]

[workspace.package]
version = "0.6.3"
edition = "2024"
license = "MIT OR Apache-2.0"
repository = "https://github.com/Juanestban/archi-games"

[workspace.dependencies]
aes = "0.8"
archi-core = { path = "crates/core" }
archi-cs2 = { path = "crates/trackers/cs2" }
archi-lol = { path = "crates/trackers/lol" }
archi-fortnite = { path = "crates/trackers/fortnite" }
archi-storage = { path = "crates/storage" }
directories = "6"
eframe = "0.37"
fluent-bundle = "0.16"
keyring = "4"
rodio = { version = "0.23", default-features = false, features = ["playback"] }
reqwest = { version = "0.12", default-features = false, features = [
  "native-tls",
] }
rusqlite = { version = "0.41", features = ["bundled"] }
serde = { version = "1", features = ["derive"] }
serde_json = "1"
sha2 = "0.10"
sys-locale = "0.3"
thiserror = "2"
tokio = { version = "1", features = [
  "io-util",
  "macros",
  "net",
  "rt",
  "sync",
  "time",
] }
toml = "0.8"
tray-icon = "0.26"
winresource = "0.1"
unic-langid = "0.9"
windows-sys = { version = "0.59", features = [
  "Win32_Foundation",
  "Win32_System_Diagnostics_ToolHelp",
  "Win32_System_Registry",
  "Win32_System_Threading",
  "Win32_Security",
] }

# Debug builds (cargo run) with the dependencies optimized: egui and the renderer run about as
# fast as in release, while the app's own crates still build quickly and keep full debug info.
[profile.dev.package."*"]
opt-level = 2
