# Publishes a GitHub release when a version tag is pushed (see RELEASING.md):
#   git tag v0.2.0 && git push origin v0.2.0
# The in-app updater (crates/app/src/update.rs) reads these releases; it needs the three
# assets below with exactly these names.

name: Release

on:
  push:
    tags: ["v*.*.*"]

permissions:
  contents: write

jobs:
  windows:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - uses: Swatinem/rust-cache@v2

      # WiX 5 runs as a .NET tool (dotnet-tools.json).
      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Tag matches the Cargo version
        shell: pwsh
        run: |
          $version = (Select-String -Path Cargo.toml -Pattern '^version = "(.+)"').Matches[0].Groups[1].Value
          if ("v$version" -ne "${{ github.ref_name }}") {
            throw "Tag ${{ github.ref_name }} doesn't match version $version in Cargo.toml"
          }

      - name: Test
        run: cargo test --workspace --locked

      # target\dist: ArchiGames-<v>-x64.msi, ArchiGames-<v>-x64-portable.exe, SHA256SUMS.txt
      - name: Package
        shell: pwsh
        run: ./scripts/package.ps1

      - name: Publish the release
        uses: softprops/action-gh-release@v2
        with:
          name: Archi Games ${{ github.ref_name }}
          generate_release_notes: true
          files: target/dist/*
