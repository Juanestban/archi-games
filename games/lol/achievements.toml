# Logros de League of Legends. Los textos son tokens Fluent: ver locales/{es,en}.ftl.
# Datos: la Live Client Data API del propio juego (127.0.0.1:2999) durante cada partida; la app
# suma cada partida terminada en el modo "all" (ver crates/trackers/lol/src/live.rs).
# El juego base y cada paquete pueden tener un platino, que llega solo al completar su parte.

[game]
id = "lol"
name = "lol-name"
# Todo lo suma la app partida a partida: empieza en 0.
local_modes = ["all"]

[[achievement]]
id = "first_win"
name = "lol-first_win-name"
description = "lol-first_win-desc"
tier = "bronze"
condition = { type = "total", stat = "wins", target = 1 }

[[achievement]]
id = "first_blood"
name = "lol-first_blood-name"
description = "lol-first_blood-desc"
tier = "bronze"
condition = { type = "total", stat = "first_blood", target = 1 }

