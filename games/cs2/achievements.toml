# Logros de Counter-Strike 2. Los textos son tokens Fluent: ver locales/{es,en}.ftl.
# Estadísticas de Steam (GetUserStatsForGame, appid 730) sin el prefijo "total_",
# en el modo "all". "matches" = partidas jugadas; "wins" son rondas ganadas, así que
# las victorias de partida son "matches_won".

[game]
id = "cs2"
name = "cs2-name"

[[achievement]]
id = "first_win"
name = "cs2-first_win-name"
description = "cs2-first_win-desc"
tier = "bronze"
condition = { type = "total", stat = "matches_won", target = 1 }

[[achievement]]
id = "wins_50"
name = "cs2-wins_50-name"
description = "cs2-wins_50-desc"
tier = "silver"
condition = { type = "total", stat = "matches_won", target = 50 }

[[achievement]]
id = "kills_1000"
name = "cs2-kills_1000-name"
description = "cs2-kills_1000-desc"
tier = "gold"
condition = { type = "total", stat = "kills", target = 1000 }

