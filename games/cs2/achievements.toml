# Logros de Counter-Strike 2. Los textos son tokens Fluent: ver locales/{es,en}.ftl.
# Datos de Game State Integration (ver crates/trackers/cs2): cada partida competitiva,
# Premier, casual o de compañeros jugada hasta el final suma al modo "all":
# matches, matches_won, kills, deaths, assists, mvps, score, kills_headshot, aces y
# kills_<arma> (ak47, m4, awp, knife, taser, deagle…; el arma en la mano cuando se
# registra la baja).

[game]
id = "cs2"
name = "cs2-name"
# Todo sale de las partidas registradas por la app: empieza en 0.
local_modes = ["all"]

[[achievement]]
id = "first_win"
name = "cs2-first_win-name"
description = "cs2-first_win-desc"
tier = "bronze"
condition = { type = "total", stat = "matches_won", target = 1 }

[[achievement]]
id = "wins_50"
name = "cs2-wins_50-name"
description = "cs2-wins_50-desc"
tier = "silver"
condition = { type = "total", stat = "matches_won", target = 50 }

[[achievement]]
id = "kills_1000"
name = "cs2-kills_1000-name"
description = "cs2-kills_1000-desc"
tier = "gold"
condition = { type = "total", stat = "kills", target = 1000 }

[[achievement]]
id = "headshots_500"
name = "cs2-headshots_500-name"
description = "cs2-headshots_500-desc"
tier = "silver"
condition = { type = "total", stat = "kills_headshot", target = 500 }

[[achievement]]
id = "mvps_100"
name = "cs2-mvps_100-name"
description = "cs2-mvps_100-desc"
tier = "silver"
condition = { type = "total", stat = "mvps", target = 100 }

[[achievement]]
id = "ace"
name = "cs2-ace-name"
description = "cs2-ace-desc"
tier = "gold"
condition = { type = "total", stat = "aces", target = 1 }

[[achievement]]
id = "match_kills_25"
name = "cs2-match_kills_25-name"
description = "cs2-match_kills_25-desc"
tier = "gold"
condition = { type = "match", all = [{ stat = "kills", gte = 25 }] }

[[achievement]]
id = "platinum"
name = "cs2-platinum-name"
description = "cs2-platinum-desc"
tier = "platinum"

# Paquete "arsenal": bajas por arma. No cuenta para el platino.

