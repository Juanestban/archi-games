# Logros de Fortnite. Los textos son tokens Fluent: ver locales/{es,en}.ftl.
# Modos: all (total), solo, duo, trio, squad, ltm; replay (repeticiones); battlepass; input_*.
# El juego base y cada paquete pueden tener un platino, que llega solo al completar su parte.
# El nombre de cada paquete es el token fortnite-pack-<pack>.

[game]
id = "fortnite"
name = "fortnite-name"
# Lo que suman las repeticiones empieza en 0; el resto (la API) cuenta desde que aparece.
local_modes = ["replay"]

[[achievement]]
id = "first_win"
name = "fortnite-first_win-name"
description = "fortnite-first_win-desc"
tier = "bronze"
condition = { type = "total", stat = "wins", target = 1 }

