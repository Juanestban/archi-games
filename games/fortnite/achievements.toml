# Más logros (2026-11-03). Repeticiones: derribos y distancia de cada eliminación salen de los
# eventos playerElim; el daño a estructuras incluye objetos del mapa. Trayectoria (API): nivel
# del pase de batalla de la temporada (condición "reach", el valor actual) y victorias por
